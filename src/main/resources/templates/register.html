<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaleMaster - Add New User</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background-color: white; padding: 35px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        .register-container h2 { margin-top: 0; color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 14px; color: #555; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { padding: 11px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-register { background-color: #1abc9c; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn-register:hover { background-color: #16a085; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
        .error-msg { color: #e74c3c; background-color: #fde8e7; padding: 10px; border-radius: 4px; font-size: 13px; text-align: center; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="register-container">
    <h2>➕ Add New User Profile</h2>
    
    <div class="error-msg" th:if="${param.error != null and param.error[0] == 'exists'}">
        ❌ This Username already exists! Try another.
    </div>

    <form th:action="@{/register}" method="POST">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="fullName" placeholder="e.g. Abdullah Khan" required>
        </div>
        
        <div class="form-group">
            <label>Username (For Login)</label>
            <input type="text" name="username" placeholder="e.g. abdullah99" required>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        
        <div class="form-group">
            <label>User Role</label>
            <select name="role">
                <option value="Admin">Admin (Full Control)</option>
                <option value="Manager">Manager (Stock View/Edit)</option>
                <option value="Cashier">Cashier (Sales Entry Only)</option>
            </select>
        </div>
        
        <button type="submit" class="btn-register">Create Account</button>
        <a href="/dashboard" class="btn-back">🔙 Cancel & Go Back</a>
    </form>
</div>

</body>
</html>
