<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaleMaster - Edit Product</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 40px; display: flex; justify-content: center; }
        .form-container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 14px; color: #555; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-submit { background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-submit:hover { background-color: #2980b9; }
        .btn-cancel { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 style="color: #2c3e50; margin-top: 0; text-align: center;">📝 Edit Product</h2>
    <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">
    
    <form th:action="@{/update-product}" method="POST">
        <input type="hidden" name="id" th:value="${product.id}">

        <div class="form-group">
            <label>Invoice ID</label>
            <input type="text" name="invoiceId" th:value="${product.invoiceId}" required>
        </div>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="name" th:value="${product.name}" required>
        </div>
        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="quantity" th:value="${product.quantity}" min="1" required>
        </div>
        <div class="form-group">
            <label>Total Price ($)</label>
            <input type="number" step="0.01" name="totalPrice" th:value="${product.totalPrice}" required>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="Paid" th:selected="${product.status == 'Paid'}">Paid</option>
                <option value="Pending" th:selected="${product.status == 'Pending'}">Pending</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Update Product Info</button>
        <a href="/dashboard" class="btn-cancel">Cancel & Go Back</a>
    </form>
</div>

</body>
</html>
