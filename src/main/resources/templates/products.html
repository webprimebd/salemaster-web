<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaleMaster - Stock</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            height: 100vh;
            color: white;
            position: fixed;
            padding-top: 20px;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #1abc9c;
        }
        .sidebar a {
            display: block;
            color: #bdc3c7;
            padding: 15px 25px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #34495e;
            color: white;
            border-left: 4px solid #1abc9c;
        }
        .main-content {
            margin-left: 250px;
            padding: 40px;
            width: calc(100% - 250px);
        }
        .table-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #333;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>SaleMaster</h2>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/products" class="active">📦 Stock/Products</a>
    <a href="/sales">💼 Sales & Profit</a>
    <a href="/login">🚪 Logout</a>
</div>

<div class="main-content">
    <div class="header">
        <h1>📦 Current Stock / Inventory</h1>
        <p style="color: #7f8c8d;">এখানে আপনার ডেটাবেজে থাকা সমস্ত প্রোডাক্টের তালিকা রয়েছে।</p>
    </div>

    <div class="table-container">
        <h3>All Products List</h3>
        <table>
            <thead>
                <tr>
                    <th>Invoice ID</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Total Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.invoiceId}">#INV-000</td>
                    <td th:text="${product.name}">Product Name</td>
                    <td th:text="${product.quantity}">0</td>
                    <td th:text="'$' + ${product.totalPrice}">$0.00</td>
                    <td th:text="${product.status}" 
                        th:style="${product.status == 'Paid'} ? 'color: green; font-weight: bold;' : 'color: orange; font-weight: bold;'">Status</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
