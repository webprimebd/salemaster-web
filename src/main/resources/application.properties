# Web Server Port
server.port=8080

# Thymeleaf Cache Disabled for Development
spring.thymeleaf.cache=false

# PostgreSQL Cloud Database Configuration (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Cloud Optimization Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# রেন্ডার ফ্রি টায়ারের মেমোরি ও টাইমআউট ক্র্যাশ আটকানোর গোল্ডেন ৩টি লাইন
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
