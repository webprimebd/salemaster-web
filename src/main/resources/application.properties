# Web Server Port
server.port=8080

# Thymeleaf Cache Disabled for Development
spring.thymeleaf.cache=false

# PostgreSQL Cloud Database Configuration (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA / Hibernate Definite Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Schema Export জ্যাম কাটানোর চূড়ান্ত ৩টি লাইন
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_ENV_DIALECT
